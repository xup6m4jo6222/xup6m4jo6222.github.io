// 正式網站的圖、光層、程式由 jsDelivr（免費全球 CDN，直接讀 GitHub 上這一版的檔案）送：GitHub Pages 從台灣實測每秒 25–300 KB，
// jsDelivr 1.8–10 MB（2026-10-09）。部署時 deploy.yml 把 <base> 和下面的記號換成同一個釘在提交編號的 CDN 網址。
// base 一定要直接寫在網頁裡：瀏覽器讀網頁時就照 base 先抓檔案，事後才用程式改，每個檔案會抓兩次（10/9 實測頻寬被吃掉一半）。
// 網址加 ?nocdn，或 CDN 任何一個檔案失敗（自動加 ?nocdn 重新載入）：base 改回 /room/，照舊從 GitHub 拿
(function () {
  var cdn = '__ROOM_CDN__', b = document.querySelector('base');
  // 開場上色圖依時段而定，主程式要等三維程式庫載完才設定；這裡先叫瀏覽器開始下載
  var q = (location.search.match(/[?&]time=(dawn|day|dusk|night)/) || [])[1], h = new Date().getHours();
  var slot = q || (h >= 5 && h < 8 ? 'dawn' : h >= 8 && h < 16 ? 'day' : h >= 16 && h < 19 ? 'dusk' : 'night');
  function pre() { var l = document.createElement('link'); l.rel = 'preload'; l.as = 'image'; l.href = 'intro-color-' + slot + '.jpg'; document.head.appendChild(l); }
  if (!b || cdn.indexOf('__') === 0) return pre();   // 本機預覽：沒換過，照舊用 /room/
  if (/[?&]nocdn/.test(location.search)) { b.href = '/room/'; return pre(); }
  window.__cdn = cdn; pre();
  window.__cdnFail = function () { if (window.__cdnBail) return; window.__cdnBail = 1; location.replace(location.origin + location.pathname + (location.search ? location.search + '&' : '?') + 'nocdn'); };
  addEventListener('error', function (e) { var t = e.target, u = t && (t.src || t.href); if (u && String(u).indexOf(cdn) === 0) window.__cdnFail(); }, true);
  // 站內連結（/projects/ 這種）不能跟著 base 跑到 CDN 去
  document.addEventListener('DOMContentLoaded', function () { document.querySelectorAll('a[href^="/"]').forEach(function (a) { a.href = location.origin + a.getAttribute('href'); }); });
})();
</script>

// JS 錯誤浮上檯面：放在 head、不加 defer，讓後面任何錯誤都看得到
window.__errors = [];
function __showError(msg) {
  window.__errors.push(msg);
  var bar = document.getElementById('errbar');
  if (!bar) return;
  bar.hidden = false;
  bar.querySelector('.msg').textContent = window.__errors.slice(-3).join('\n');
}
window.addEventListener('error', function (e) { __showError((e.message || '錯誤') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')); });
window.addEventListener('unhandledrejection', function (e) { __showError('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
</script>
