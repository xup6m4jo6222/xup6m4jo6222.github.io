// 兩家同時抓、先到先用（郁為 10/9：最差也要 8 秒內）。jsDelivr 偶爾分到很慢的節點（實測約十幾次一次、每秒只有 70 KB，開場拖到 20 多秒）：

// 訪客自己的網路慢（瀏覽器回報 2G／3G 或不到 2 Mbps）時晚一點才找第二家。以前是乾脆不找，但瀏覽器的估計是拿剛才那個慢節點量的，
// 慢的其實是 CDN 那頭，結果只剩更慢的 GitHub 可找，開場拖到 17 秒（10/9 手機尺寸量到）。

// 同一個檔案只抓一次：網頁開頭就先替必要檔案呼叫（發布時產生），主程式之後再要時拿同一份。
// 以前開頭只是「預先下載」，要等主程式跑起來呼叫才開始計時找第二家，主網址一慢，光層要到 8 秒才向第二家要（10/9 量到）

<title>林郁為｜作品</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500&family=LXGW+WenKai+TC:wght@400;700&family=Cormorant+Garamond:wght@500;600&display=fallback" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* 色票沿用正式網站 global.css：背景主色暮紫、元素主色鋼藍、問句淡紫 */
:root {
  --bg: #20131d;
  --bg-deep: #1d1119;
  --ink: #ebe5eb;
  --muted: #a2979f;
  --steel: #7998c3;
  --ask: #c8b7ea;
  --line: #5d505a;
  --glass: rgba(32, 19, 29, 0.62);
  --glass-strong: rgba(29, 17, 25, 0.86);
  --font-display: 'LXGW WenKai TC', serif;
  --font-sans: 'Chiron GoRound TC', system-ui, sans-serif;
  --ease: cubic-bezier(.22, .61, .36, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg-deep); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; }

.topbar { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: baseline;
  padding: 22px 32px; pointer-events: none; opacity: 0; transition: opacity 1.2s var(--ease); z-index: 5; }
body.ready .topbar { opacity: 1; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .08em; pointer-events: auto; text-shadow: 0 1px 12px rgba(0,0,0,.6); }
.brand .sub { font-family: var(--font-sans); font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 14px; letter-spacing: .04em; }
.direct { pointer-events: auto; color: var(--steel); font-size: 14px; text-decoration: none; border-bottom: 1px solid rgba(121,152,195,.45); padding-bottom: 2px; letter-spacing: .04em; }
.direct:hover { color: #9fb6d8; border-color: currentColor; }
.topright { display: flex; gap: 22px; align-items: baseline; }
.soundbtn { font: inherit; font-size: 14px; background: none; border: 0; border-bottom: 1px solid rgba(121,152,195,.45); cursor: pointer; }
.soundbtn[aria-pressed="false"] { color: var(--muted); border-bottom-style: dashed; }

/* 熱點 */
#hotspots { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
.hot { position: absolute; pointer-events: auto; display: flex; align-items: center; gap: 12px;
  background: none; border: 0; padding: 10px; cursor: pointer; opacity: 0; transition: opacity .35s var(--ease); }
.hot.on { opacity: 1; transition: opacity 1s var(--ease) .25s; }   /* 離開時快、回來時慢慢浮現 */
.hot.left { flex-direction: row-reverse; }
/* 光點：實心小核＋柔光暈＋緩慢呼吸的細環 */
.hot .dot { position: relative; width: 9px; height: 9px; border-radius: 50%; flex: none; background: #f4eef4;
  box-shadow: 0 0 6px 1px rgba(255,244,236,.75), 0 0 22px 6px rgba(200,183,234,.28); transition: transform .45s var(--ease), background .45s; }
.hot .dot::before { content: ''; position: absolute; inset: -9px; border-radius: 50%; border: 1px solid rgba(244,238,244,.42);
  animation: breathe-ring 3.6s ease-in-out infinite; transition: inset .45s var(--ease), border-color .45s; }
.hot .label { font-size: 14px; letter-spacing: .08em; padding: 6px 14px; border-radius: 999px; background: var(--glass-strong);
  border: 1px solid rgba(121,152,195,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); white-space: nowrap;
  opacity: 0; transform: translateX(-6px); pointer-events: none; transition: opacity .4s var(--ease), transform .45s var(--ease); }
.hot.left .label { transform: translateX(6px); }
.hot:hover .dot, .hot:focus-visible .dot { transform: scale(1.25); background: #fff; }
.hot:hover .dot::before, .hot:focus-visible .dot::before { inset: -13px; border-color: rgba(121,152,195,.85); animation: none; }
.hot:hover .label, .hot:focus-visible .label { opacity: 1; transform: none; }
/* 滑鼠移到物件本身（不在光點上）也算：.near 由 main.js 依距離標上 */
.hot.near .dot { transform: scale(1.25); background: #fff; }
.hot.near .dot::before { inset: -13px; border-color: rgba(121,152,195,.85); animation: none; }
.hot.near .label { opacity: 1; transform: none; }
.hot:focus-visible { outline: none; }
@keyframes breathe-ring { 0%, 100% { transform: scale(.85); opacity: .25; } 50% { transform: scale(1.12); opacity: .75; } }
@keyframes pulse { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }

.chip { white-space: nowrap; border: 1px solid rgba(235,229,235,.22); background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-radius: 999px; padding: 9px 18px; font-size: 14px; letter-spacing: .05em; cursor: pointer; transition: all .3s var(--ease); }
.chip:hover, .chip:focus-visible { border-color: var(--steel); background: var(--glass-strong); outline: none; }
.chip.primary { border-color: rgba(121,152,195,.8); color: #fff; background: rgba(121,152,195,.22); }
.chip.primary:hover { background: rgba(121,152,195,.36); }
.chip.small { padding: 7px 14px; font-size: 13px; }
.back { position: fixed; top: 76px; left: 32px; z-index: 6; }

.hint { position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%); margin: 0; color: var(--muted); font-size: 14px; letter-spacing: .08em;
  z-index: 5; text-shadow: 0 1px 10px rgba(0,0,0,.8); }
/* 點了之後畫面還在下載：鏡頭停在半路、失焦，中央一行字與進度 */
.viewload { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); margin: 0; z-index: 6; font-size: 14px; letter-spacing: .08em;
  padding: 8px 18px; border-radius: 999px; background: var(--glass-strong); border: 1px solid rgba(121,152,195,.45);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); white-space: nowrap; font-variant-numeric: tabular-nums; }
.booktip { position: fixed; z-index: 6; margin: 0; transform: translate(-50%, -130%); font-family: var(--font-display); font-size: 17px; padding: 7px 14px;
  border-radius: 10px; background: var(--glass-strong); border: 1px solid rgba(121,152,195,.5); pointer-events: none; white-space: nowrap; }
.booktip small { display: block; font-family: var(--font-sans); font-size: 12px; color: var(--muted); margin-top: 2px; }

.bookui { position: fixed; bottom: 6vh; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; z-index: 6; }
.bookui[hidden], .reader[hidden], .screen[hidden], .aroma[hidden], [hidden] { display: none !important; }

.reader { position: fixed; inset: 3vh 4vw; z-index: 20; border-radius: 16px; overflow: hidden; background: var(--bg); border: 1px solid var(--line);
  box-shadow: 0 30px 80px rgba(0,0,0,.6); display: flex; flex-direction: column; }
.reader-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 10px 22px; border-bottom: 1px solid #3d2e3a;
  font-family: var(--font-display); font-size: 17px; }
.reader iframe { flex: 1; border: 0; width: 100%; background: var(--bg); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

/* 電腦螢幕：以 matrix3d 貼到螢幕四角 */
/* 電腦螢幕：以 matrix3d 貼到螢幕四角。底是透明的：看得到渲染裡真正的曲面螢幕、桌布與玻璃反光，只有視窗浮在上面 */
.screen { position: fixed; left: 0; top: 0; width: 1600px; height: 873px; transform-origin: 0 0; z-index: 3; opacity: 0; transition: opacity .8s var(--ease);
  overflow: hidden; }
.screen.on { opacity: 1; }
.screen.flat { width: 100vw; height: 100%; pointer-events: none; }
.screen.flat .screen-inner { pointer-events: auto; top: 50%; bottom: auto; left: 16px; right: 16px; width: auto; margin: 0; translate: 0 -40%;
  max-height: 62vh; overflow: auto; background: rgba(26,15,23,.86); backdrop-filter: blur(6px); }
.screen.flat .win-bar { height: 40px; font-size: 14px; padding: 0 16px; }
.screen.flat .win-bar i { width: 10px; height: 10px; }
.screen.flat .win-body { padding: 20px 20px 22px; }
.screen.flat .win-body h2 { font-size: 26px; margin-bottom: 10px; }
.screen.flat .win-body p { font-size: 15px; margin-bottom: 18px; }
.screen.flat .win-body h3 { font-size: 13px; margin-bottom: 10px; }
.screen.flat .win-body ul { gap: 10px; }
.screen.flat .win-body li a { width: 100%; padding: 14px 16px; font-size: 17px; gap: 4px; }
.screen.flat .win-body li a small { font-size: 13px; }
.screen-inner { position: absolute; top: 110px; bottom: 110px; left: 50%; width: 1180px; margin-left: -590px; border-radius: 22px;
  background: rgba(26,15,23,.8); border: 1px solid rgba(235,229,235,.16);
  box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.25); overflow: hidden; }
.win-bar { height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid rgba(235,229,235,.1); color: var(--muted); font-size: 20px; }
.win-bar i { width: 14px; height: 14px; border-radius: 50%; background: #5d505a; }
.win-bar span { margin-left: 14px; }
.win-body { padding: 34px 56px; }
.win-body h2 { font-family: var(--font-display); font-size: 48px; margin: 0 0 14px; font-weight: 700; letter-spacing: .06em; }
.win-body p { font-size: 25px; line-height: 1.65; color: #d9d1d8; max-width: 38em; margin: 0 0 28px; }
.win-body h3 { font-size: 22px; color: var(--muted); font-weight: 500; letter-spacing: .12em; margin: 0 0 18px; }
.win-body ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 22px; flex-wrap: wrap; }
.win-body li a { display: flex; flex-direction: column; gap: 8px; width: 260px; padding: 22px 24px; border-radius: 16px; text-decoration: none; color: var(--ink);
  background: rgba(121,152,195,.12); border: 1px solid rgba(121,152,195,.4); font-size: 26px; font-family: var(--font-display); transition: background .3s; }
.win-body li a small { font-family: var(--font-sans); font-size: 18px; color: var(--muted); }
.win-body li a:hover { background: rgba(121,152,195,.26); }

.clockface { position: fixed; left: 0; top: 0; width: 400px; height: 200px; transform-origin: 0 0; z-index: 3; display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 118px; color: rgba(255, 196, 140, .92); letter-spacing: .04em;
  text-shadow: 0 0 18px rgba(255, 160, 90, .55); pointer-events: none; opacity: 0; transition: opacity .8s; }
.clockface.on { opacity: 1; }

.aroma { position: fixed; right: 4vw; top: 50%; transform: translateY(-50%); width: 300px; z-index: 6; padding: 26px 24px 22px; border-radius: 18px;
  background: var(--glass); border: 1px solid rgba(235,229,235,.14); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.aroma h2 { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 0 0 4px; letter-spacing: .06em; }
.aroma-hint { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
.aroma ul { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 6px; }
.oil { width: 100%; display: grid; grid-template-columns: 14px 1fr; gap: 4px 12px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 12px;
  background: transparent; border: 1px solid transparent; cursor: pointer; transition: all .3s var(--ease); }
.oil i { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
.oil b { font-weight: 500; font-size: 15px; letter-spacing: .06em; }
.oil span { grid-column: 2; font-size: 12px; color: var(--muted); line-height: 1.5; }
.oil:hover { background: rgba(235,229,235,.06); }
.oil.on { border-color: rgba(121,152,195,.6); background: rgba(121,152,195,.12); }

.loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 30; pointer-events: none; transition: opacity .8s; background: #0c070b; }
.loading .ld { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.loading .ld i { width: 7px; height: 7px; border-radius: 50%; background: #ffd9ae; box-shadow: 0 0 10px 2px rgba(255,190,120,.7), 0 0 38px 10px rgba(255,160,90,.22);
  animation: ember 2.4s ease-in-out infinite; }
.loading .ld span { font-family: var(--font-display); color: var(--muted); letter-spacing: .4em; font-size: 14px; padding-left: .4em; animation: breathe 2.4s ease-in-out infinite; }
@keyframes ember { 50% { transform: scale(.8); opacity: .55; box-shadow: 0 0 6px 1px rgba(255,190,120,.5), 0 0 24px 6px rgba(255,160,90,.12); } }
body.loaded .loading { opacity: 0; }
@keyframes breathe { 50% { opacity: .35; } }

.mobilenav::-webkit-scrollbar { display: none; }
.mobilenav { scrollbar-width: none; position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 6; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.mobilenav .chip { flex: none; }

.errbar { position: fixed; left: 12px; bottom: 12px; z-index: 99; background: #3a1a22; border: 1px solid #a05060; border-radius: 10px; padding: 8px 10px; max-width: 70vw; display: flex; gap: 10px; align-items: flex-start; }
.errbar pre { margin: 0; font-size: 11px; white-space: pre-wrap; color: #f4d0d6; max-height: 30vh; overflow: auto; }
.errbar button { font-size: 11px; }

@media (max-width: 760px) {
  .topbar { padding: 14px 16px; flex-direction: column; gap: 4px; }
  .brand { font-size: 19px; }
  .brand .sub { display: block; margin: 2px 0 0; font-size: 12px; }

<script>
// 開場線稿：一筆一筆描出來（筆順圖由 make-intro-order.py 算出：遠的先、近的後，段內沿著線長出去）
// 普通腳本、不等 three.js：頁面一出現就開始畫。畫完 window.__introDrawn 會 resolve，主程式才開始上色。
(function () {
  let doneFn; window.__introDrawn = new Promise(r => { doneFn = r; });
  const box = document.getElementById('loading'), img = box && box.querySelector('.ld-lines');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let returning = false; try { returning = localStorage.getItem('v30-entry') === 'room'; } catch {}
  const DRAW = returning ? 1.8 : 3.4;   // 秒；來過的人畫快一點。房間先下載好就加速畫完（window.__ldHurry），不讓線稿拖住上色
  const cv = document.createElement('canvas'); cv.className = 'ld-draw'; cv.setAttribute('aria-hidden', 'true');
  const gl = cv.getContext('webgl', { premultipliedAlpha: false, alpha: false });
  if (!box || !img || !gl || reduce) { doneFn(); return; }   // 不支援或要求減少動態：直接顯示整張線稿
  img.style.visibility = 'hidden'; img.after(cv);
  const vs = 'attribute vec2 p; varying vec2 v; void main(){ v = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }';
  const fs = `precision mediump float; varying vec2 v; uniform sampler2D L, O; uniform float T; uniform vec4 C;
    void main(){
      vec2 uv = vec2(C.x + v.x * C.y, C.z + (1.0 - v.y) * C.w);
      vec3 bg = vec3(29.0, 17.0, 25.0) / 255.0;
      vec3 l = texture2D(L, uv).rgb; float o = texture2D(O, uv).r * 255.0;
      float on = step(0.5, o), t = (o - 1.0) / 254.0;
      float rev = clamp((T - t) / 0.025, 0.0, 1.0) * on;
      float lw = clamp((dot(l, vec3(0.333)) - 0.086) / 0.79, 0.0, 1.0);
      float glow = exp(-pow((T - t) / 0.01, 2.0)) * on * lw * lw;
      gl_FragColor = vec4(bg + (l - bg) * rev + vec3(0.59, 0.69, 0.92) * glow * 0.5, 1.0);

    const dpr = Math.min(window.devicePixelRatio || 1, 2), w = cv.clientWidth, h = cv.clientHeight;

    iw = li.naturalWidth; ih = li.naturalHeight;

// 載入進度（郁為 10/9：要很明顯告訴對方正在載入）：一開頁就動，不等三維程式庫。
// 下載占 90%：照發布時算好的必要檔案清單（window.__ldFiles，檔名→位元組），看已經下載完的檔案加起來多少；
// 上色占 7%（主程式給 window.__ldColor），最後準備房間那一下到 97–99%（window.__ldTarget）。沒有清單（本機預覽）就照時間慢慢爬
(function () {
  const el = document.getElementById('loading'), pct = el && el.querySelector('.ld-pct');
  if (!el) return;
  const files = window.__ldFiles, total = files ? Object.values(files).reduce((a, b) => a + b, 0) : 0;
  const t0 = performance.now(); let shown = 0, dl = 0, lastScan = 0;
  function scan() {
    let got = 0; const seen = {};

    return got / total;
  }

    if (total && now - lastScan > 150) { dl = scan(); lastScan = now; }

    if (!done) requestAnimationFrame(tick);
